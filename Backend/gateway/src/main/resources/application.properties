spring.application.name=gateway
server.port=8086

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ---------- Routes dynamiques via Eureka (un seul Path par route, numeros sans trou) ----------
spring.cloud.gateway.server.webmvc.routes[0].id=claim-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CLAIM-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/claims/**

spring.cloud.gateway.server.webmvc.routes[1].id=client-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CLIENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/clients/**

spring.cloud.gateway.server.webmvc.routes[2].id=contract-service-insurance-types
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://CONTRACT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/insurance-types/**

spring.cloud.gateway.server.webmvc.routes[3].id=contract-service-subscriptions
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://CONTRACT-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/subscriptions/**

spring.cloud.gateway.server.webmvc.routes[4].id=contract-service-contracts
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://CONTRACT-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/contracts/**

# /internal/** n'est volontairement JAMAIS route : appels inter-services uniquement

# A ajouter plus tard par l'equipe (prefixe webmvc, numeros a la suite) :
#spring.cloud.gateway.server.webmvc.routes[N].id=compensation-service
#spring.cloud.gateway.server.webmvc.routes[N].uri=lb://COMPENSATION-SERVICE
#spring.cloud.gateway.server.webmvc.routes[N].predicates[0]=Path=/api/compensations/**

# ---------- Logs pour observer le routage et le load balancing ----------
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.gateway.server.mvc.filter.LoadBalancerFilterFunctions=TRACE