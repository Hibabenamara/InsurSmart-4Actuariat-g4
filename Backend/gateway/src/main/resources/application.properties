spring.application.name=gateway
server.port=8086

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ---------- Routes dynamiques via Eureka ----------
spring.cloud.gateway.server.webmvc.routes[0].id=claim-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CLAIM-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/claims/**

spring.cloud.gateway.server.webmvc.routes[1].id=client-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CLIENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/clients/**

# contract-service : 3 routes, chacune protegee par le circuit breaker contractCB
spring.cloud.gateway.server.webmvc.routes[2].id=contract-service-insurance-types
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://CONTRACT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/insurance-types/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=CircuitBreaker=contractCB,forward:/fallback/contract

spring.cloud.gateway.server.webmvc.routes[3].id=contract-service-subscriptions
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://CONTRACT-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/subscriptions/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=CircuitBreaker=contractCB,forward:/fallback/contract

spring.cloud.gateway.server.webmvc.routes[4].id=contract-service-contracts
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://CONTRACT-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/contracts/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=CircuitBreaker=contractCB,forward:/fallback/contract

# ---------- Swagger unifie ----------
spring.cloud.gateway.server.webmvc.routes[5].id=contract-service-docs
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://CONTRACT-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/contract-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[6].id=claim-service-docs
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://CLAIM-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/claim-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=StripPrefix=1

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=contract-service
springdoc.swagger-ui.urls[0].url=/contract-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=claim-service
springdoc.swagger-ui.urls[1].url=/claim-service/v3/api-docs

# /internal/** n'est volontairement JAMAIS route : appels inter-services uniquement

# ---------- Resilience4j : circuit breaker contractCB ----------
# Sur 5 appels, si >= 50 % echouent (min. 3) -> OPEN 10 s, puis HALF_OPEN (2 essais)
resilience4j.circuitbreaker.instances.contractCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.contractCB.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.contractCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.contractCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.contractCB.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.instances.contractCB.timeout-duration=3s

# ---------- Logs ----------
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.gateway.server.mvc.filter.LoadBalancerFilterFunctions=TRACE
logging.level.io.github.resilience4j=DEBUG