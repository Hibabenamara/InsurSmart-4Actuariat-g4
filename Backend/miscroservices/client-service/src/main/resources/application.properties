spring.application.name=client-service
server.port=8081
spring.config.import=optional:configserver:http://config-server:8888

# Base de données H2 embarquée
spring.datasource.url=jdbc:h2:mem:client_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=edam
spring.datasource.password=
spring.h2.console.enabled=true

# Eureka, RabbitMQ, Keycloak et Swagger
#eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.rabbitmq.host=rabbitmq

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8180/realms/insursmart
springdoc.swagger-ui.path=/swagger-ui.html