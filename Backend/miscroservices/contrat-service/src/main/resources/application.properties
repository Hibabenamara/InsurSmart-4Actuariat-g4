spring.application.name=contract-service
server.port=8082

# Base MySQL contract_db (XAMPP / WAMP)
spring.datasource.url=jdbc:mysql://localhost:3306/contract_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# ---------- Atelier Observabilite : Spring Boot Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
eureka.client.healthcheck.enabled=true
management.info.env.enabled=true

info.app.name=contract-service
info.app.version=1.0.0
info.app.description=Microservice de gestion des contrats (catalogue, garanties, souscriptions, contrats)
info.app.team=InsurSmart 4Actuariat G4